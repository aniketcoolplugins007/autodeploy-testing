      <li><strong>Repository:</strong> <code>${{ github.repository }}</code></li>
      <li><strong>Workflow Run:</strong> <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View Logs</a></li>
